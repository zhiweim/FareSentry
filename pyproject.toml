[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "faresentry"
version = "0.1.0"
description = "A personalized flight-shopping agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "strands-agents>=1.55,<2",
    "boto3[crt]>=1.41,<2",
    "pydantic>=2.0,<3",
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
